[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polygnosis-api"
version = "1.0.0"
description = "PolyGnosis as a public HTTP API — adversarial multi-model consensus with RRF+Borda ranking"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Moses / LatticeAG" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
polygnosis-api = "polygnosis_api.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/polygnosis_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
